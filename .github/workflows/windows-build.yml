# Builds the Windows app on every push, checks it, and publishes the zip as a download.
name: Windows build

on:
  push:
    branches: [main, "sprint-*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: drills-and-shop
  ZIP: dist/BitMiner-DrillsAndShop-windows.zip

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Self-test from source
        run: python -m bitminer --selftest

      - name: Build BitMiner.exe
        run: python packaging/build.py

      - name: Self-test the built game
        shell: pwsh
        run: |
          $p = Start-Process dist/BitMiner/BitMiner.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path dist/BitMiner/bitminer_error.log) { Get-Content dist/BitMiner/bitminer_error.log }
            exit 1
          }
          Write-Host "Built game passed its self-test"

      # The build machine has no graphics card, so this borrows Mesa's software OpenGL to fly a
      # scripted route, fight in the sandbox, play Secure the Base and a gallery scene in the real exe, then prints the game's notes and a
      # text copy of what it drew.
      # Informational: it never blocks a release.
      - name: Render check with software OpenGL
        id: render
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GALLIUM_DRIVER: llvmpipe
        run: python packaging/render_check.py dist/BitMiner shots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-check-screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: BitMiner-DrillsAndShop-windows
          path: ${{ env.ZIP }}

      - name: Publish the download
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete $env:RELEASE_TAG --yes --cleanup-tag 2>$null
          $LASTEXITCODE = 0
          gh release create $env:RELEASE_TAG $env:ZIP --prerelease --target $env:GITHUB_SHA `
            --title "BitMiner Drills and the Station Shop (sprint 7)" --notes-file packaging/release_notes.md
