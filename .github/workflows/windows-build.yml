# Builds the Windows app on every push, checks it, and publishes the zip as a download.
name: Windows build

on:
  push:
    branches: [main, "sprint-*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: flight-test
  ZIP: dist/BitMiner-FlightTest-windows.zip

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Self-test from source
        run: python -m bitminer --selftest

      - name: Build BitMiner.exe
        run: python packaging/build.py

      - name: Self-test the built game
        shell: pwsh
        run: |
          $p = Start-Process dist/BitMiner/BitMiner.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path dist/BitMiner/bitminer_error.log) { Get-Content dist/BitMiner/bitminer_error.log }
            exit 1
          }
          Write-Host "Built game passed its self-test"

      # The build machine has no graphics card, so borrow Mesa's software OpenGL to fly a
      # scripted route in the real exe and keep screenshots. Informational: never blocks a release.
      - name: Render check with software OpenGL
        id: render
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pal1000/mesa-dist-win --pattern "mesa3d-*-release-msvc.7z" --dir mesa
          7z x (Get-ChildItem mesa/*.7z).FullName -omesa/x -y | Out-Null
          New-Item -ItemType Directory -Force render-check, shots | Out-Null
          Copy-Item -Recurse dist/BitMiner render-check/
          Copy-Item mesa/x/x64/*.dll render-check/BitMiner/
          $shots = (Resolve-Path shots).Path
          $smokeArgs = "--smoke 6 --shots 1.5,2.5,5.5 --size 1280x720 --shot-dir `"$shots`" --settings `"$shots\tuning.json`""
          $p = Start-Process render-check/BitMiner/BitMiner.exe -ArgumentList $smokeArgs -PassThru
          if (-not $p.WaitForExit(240000)) { Stop-Process $p -Force; throw "render check timed out" }
          if (Test-Path render-check/BitMiner/bitminer_error.log) { Get-Content render-check/BitMiner/bitminer_error.log }
          Get-ChildItem shots
          if ($p.ExitCode -ne 0) { throw "render check exited with $($p.ExitCode)" }
          if (-not (Get-ChildItem shots/*.png)) { throw "no screenshots" }

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-check-screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: BitMiner-FlightTest-windows
          path: ${{ env.ZIP }}

      - name: Publish the download
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete $env:RELEASE_TAG --yes --cleanup-tag 2>$null
          $LASTEXITCODE = 0
          gh release create $env:RELEASE_TAG $env:ZIP --prerelease --target $env:GITHUB_SHA `
            --title "BitMiner flight test (sprint 2)" --notes-file packaging/release_notes.md
